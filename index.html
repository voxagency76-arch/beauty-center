<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Malak Ashraf Beauty Center – Beauty Memory</title>
<style>
:root{
  --bg1:#fcf8f1; --bg2:#efe2cd; --sand:#e8d8bd; --tan:#cfae80; --gold:#b58b45; --gold-l:#e6cf96; --gold-d:#8f6a2c;
  --cocoa:#3d2b25; --mocha:#6e564a; --muted:#7b6a5e; --rose:#c48b7a; --paper:#fffdf9; --line:#e6d7bf;
  --ok:#2f7d5b; --bad:#b3362f;
  --r:20px; --shadow:0 10px 30px rgba(92,64,40,.12); --shadow-l:0 24px 60px rgba(92,64,40,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--cocoa);min-height:100vh;line-height:1.65;overflow-x:hidden;
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,-apple-system,Arial,sans-serif;
  background:radial-gradient(1200px 600px at 85% -10%,#f6e9d2 0%,transparent 60%),radial-gradient(900px 500px at -10% 30%,#f3e1d6 0%,transparent 55%),linear-gradient(180deg,var(--bg1),var(--bg2) 160%);
  background-attachment:fixed}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px;position:relative;z-index:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#fx i{position:absolute;color:var(--gold-l);font-style:normal;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(20px) scale(.6);opacity:0}15%{opacity:.8}100%{transform:translateY(-110vh) scale(1.2) rotate(40deg);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.banner{background:#f4ead2;color:#6d5320;text-align:center;font-size:.82rem;padding:6px 10px;border-bottom:1px solid var(--line);position:relative;z-index:25}

/* header */
header.top{position:sticky;top:0;z-index:30;background:rgba(252,248,241,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 0;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;background:none;border:0;padding:0;text-align:start}
.mono{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1rem;letter-spacing:.5px;
  background:linear-gradient(135deg,var(--gold),var(--gold-l));box-shadow:0 4px 14px rgba(181,139,69,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.brand b{display:block;font-size:1.05rem;color:var(--cocoa);line-height:1.15;font-family:Georgia,"Times New Roman",serif;letter-spacing:.3px}
.brand small{display:block;color:var(--gold-d);font-size:.66rem;letter-spacing:2.4px;text-transform:uppercase}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button,.chip{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--mocha);font-weight:600;transition:background .2s,color .2s}
nav button[aria-current=page]{background:var(--sand);color:var(--cocoa)}
nav button:hover,.chip:hover{background:var(--sand)}
.chip{border:1px solid var(--line);background:var(--paper)}
.credits{background:linear-gradient(135deg,var(--cocoa),#5a4036);color:#f7e8c8;padding:6px 14px;border-radius:999px;font-weight:700;font-size:.88rem;box-shadow:0 4px 12px rgba(61,43,37,.25)}
.credits.bump{animation:bump .6s}
@keyframes bump{40%{transform:scale(1.18)}}

/* buttons */
.btn{border:0;border-radius:999px;padding:13px 28px;font-weight:700;font-size:1rem;background:var(--cocoa);color:#fbeed0;position:relative;overflow:hidden;
  box-shadow:0 8px 20px rgba(61,43,37,.25);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(61,43,37,.3)}
.btn:active{transform:translateY(0)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-l) 55%,var(--gold));color:#3a2a0b;box-shadow:0 8px 22px rgba(181,139,69,.45)}
.btn.gold::after{content:"";position:absolute;top:0;bottom:0;width:60%;left:-80%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:sheen 3.6s infinite}
@keyframes sheen{0%,60%{left:-80%}100%{left:160%}}
.btn.ghost{background:var(--paper);color:var(--cocoa);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn:disabled::after{display:none}

/* layout */
.view{display:none;padding:30px 0 70px}.view.on{display:block;animation:viewIn .5s}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}}
h1{font-size:clamp(2rem,5.4vw,3.4rem);line-height:1.25;margin:.25em 0;font-weight:800;color:var(--cocoa)}
h1 em{font-style:normal;background:linear-gradient(120deg,var(--gold-d),var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 6px;font-size:1.6rem;color:var(--cocoa)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:.78rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold-d);font-weight:700;background:rgba(230,207,150,.28);padding:5px 14px;border-radius:999px;border:1px solid rgba(181,139,69,.3)}
.sub{color:var(--muted);margin:0 0 20px}
.lead{color:var(--muted);font-size:1.12rem;max-width:520px}
.sechead{margin-bottom:18px}
.sechead::after{content:"";display:block;width:54px;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-l));margin-top:8px}
.section{margin-top:64px}

/* hero 3D */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center;min-height:470px}
@media(max-width:820px){.hero{grid-template-columns:1fr;min-height:0}}
.scene{height:420px;perspective:1100px;position:relative;touch-action:pan-y}
@media(max-width:820px){.scene{height:340px}}
.stack{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-14deg));transition:transform .25s ease-out}
.c3d{position:absolute;width:132px;aspect-ratio:3/4;border-radius:18px;display:grid;place-items:center;background:linear-gradient(160deg,#fffdf9,#f6ead5);border:1px solid var(--line);
  box-shadow:0 30px 50px rgba(92,64,40,.22),inset 0 1px 0 #fff;animation:float 6s ease-in-out infinite}
.c3d svg{width:58%}
.c3d.back{background:linear-gradient(150deg,#efdcb9,#d8b985);border-color:#caa66d}
.c3d.back::after{content:"";position:absolute;inset:8px;border:1.5px solid rgba(255,255,255,.7);border-radius:12px}
.c3d.back span{font-family:Georgia,serif;font-weight:700;color:#fff;font-size:1.5rem;text-shadow:0 2px 6px rgba(120,80,20,.4)}
.c1{left:6%;top:14%;transform:translateZ(60px) rotateZ(-10deg)}
.c2{left:34%;top:2%;transform:translateZ(120px) rotateZ(4deg);animation-delay:-1.4s}
.c3{left:60%;top:20%;transform:translateZ(40px) rotateZ(12deg);animation-delay:-2.6s}
.c4{left:22%;top:46%;transform:translateZ(150px) rotateZ(-4deg);animation-delay:-3.8s;width:148px}
.c5{left:56%;top:52%;transform:translateZ(90px) rotateZ(8deg);animation-delay:-5s}
@keyframes float{50%{translate:0 -16px}}
.orb{position:absolute;border-radius:50%;filter:blur(2px);background:radial-gradient(circle at 30% 30%,#fff,var(--gold-l) 45%,var(--gold));opacity:.9;animation:float 7s ease-in-out infinite}
.o1{width:34px;height:34px;left:2%;top:70%;transform:translateZ(200px)}
.o2{width:20px;height:20px;left:88%;top:12%;transform:translateZ(180px);animation-delay:-2s}
.o3{width:26px;height:26px;left:48%;top:86%;transform:translateZ(220px);animation-delay:-4s}
.glow{position:absolute;inset:8% 8%;background:radial-gradient(closest-side,rgba(230,207,150,.55),transparent);filter:blur(30px);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5;transform:scale(1.08)}}

/* reveal & tilt */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
[data-tilt]{transition:transform .18s ease-out,box-shadow .3s,opacity .8s;will-change:transform}
[data-tilt]:hover{box-shadow:var(--shadow-l)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.panel{background:linear-gradient(180deg,#fffefb,#fbf4e8);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.panel h3{margin:.1em 0 .3em;color:var(--cocoa);font-size:1.12rem}
.panel p{margin:.2em 0 .6em;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.strip div{background:rgba(255,253,249,.7);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.strip b{display:block;font-size:1.6rem;color:var(--gold-d);font-family:Georgia,serif}
.strip span{font-size:.8rem;color:var(--muted)}
.step{display:flex;gap:14px;align-items:flex-start}
.ico{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#f6e9cd,#e9d3a4);box-shadow:inset 0 1px 0 #fff,0 6px 14px rgba(181,139,69,.25)}
.ico svg{width:30px;height:30px}
.rw .ico svg{width:34px;height:34px}
.tag{display:inline-block;font-size:.72rem;padding:2px 10px;border-radius:999px;background:var(--bg2);color:var(--gold-d);font-weight:700;border:1px solid #e2cd9d;vertical-align:middle}
.tag.demo{background:#fff3cd;border-color:#f0dc8a;color:#7a5b00}
.lvl .big{font-family:Georgia,serif;font-size:2.6rem;line-height:1;color:var(--tan);font-weight:700;float:inline-end;opacity:.55}
.lvl.locked{opacity:.62}
.cost{font-weight:800;color:var(--gold-d)}
.rw{display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.rw::before{content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(230,207,150,.5),transparent 70%)}

/* game */
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;align-items:stretch}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.4rem;color:var(--cocoa);font-family:Georgia,serif}.stat span{font-size:.74rem;color:var(--muted)}
.ring{--p:100;position:relative;width:64px;height:64px;border-radius:50%;margin:0 auto 2px;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0)}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--paper)}
.ring b{position:relative;z-index:1;font-size:1.25rem}
.stat.low .ring{background:conic-gradient(var(--bad) calc(var(--p)*1%),var(--line) 0);animation:pulse2 .8s infinite}
.stat.low b{color:var(--bad)}
@keyframes pulse2{50%{transform:scale(1.07)}}
.progress{height:8px;background:var(--sand);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--rose));transition:width .5s;border-radius:99px}
.table{max-width:560px;margin:0 auto;padding:18px;border-radius:28px;background:linear-gradient(160deg,#f6ead4,#ecd9b8);border:1px solid #dcc49a;box-shadow:var(--shadow-l),inset 0 2px 0 rgba(255,255,255,.6)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;perspective:1000px}
.board.c5{grid-template-columns:repeat(5,1fr)}
.tile{position:relative;aspect-ratio:3/4;border:0;background:none;padding:0;border-radius:14px;transition:transform .2s}
.tile:not(:disabled):hover{transform:translateY(-4px) scale(1.03)}
.tile .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1.2)}
.tile.flip .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:grid;place-items:center;box-shadow:0 8px 16px rgba(92,64,40,.22)}
.face.front{background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 6px,transparent 6px 12px),linear-gradient(150deg,#e9d3a6,#c9a46c);border:1px solid #b78f52}
.face.front::after{content:"";position:absolute;inset:6px;border:1.5px solid rgba(255,255,255,.65);border-radius:9px}
.face.front b{font-family:Georgia,serif;color:#fff;font-size:1.15rem;text-shadow:0 2px 5px rgba(100,64,10,.45);letter-spacing:1px}
.face.back{background:linear-gradient(160deg,#fffefb,#f7ecd9);border:1px solid var(--line);transform:rotateY(180deg)}
.face.back svg{width:58%;filter:drop-shadow(0 4px 4px rgba(92,64,40,.2))}
.tile.matched .face.back{background:linear-gradient(160deg,#f3fbf6,#e2f2e8);border-color:#a8d5bd}
.tile.matched::after{content:"✦";position:absolute;top:-6px;inset-inline-end:-4px;color:var(--gold);font-size:1.1rem;animation:spark 1s forwards;pointer-events:none}
@keyframes spark{from{transform:scale(0) rotate(0);opacity:1}to{transform:scale(1.8) rotate(90deg);opacity:0}}
.tile:disabled{cursor:default}
.tile.hint .face{box-shadow:0 0 0 3px var(--gold),0 0 24px rgba(181,139,69,.8)}
.tile.shake{animation:shake .4s}
@keyframes shake{25%{translate:-5px 0}75%{translate:5px 0}}
.actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

/* modal & toast */
.modal{position:fixed;inset:0;background:rgba(61,43,37,.55);backdrop-filter:blur(4px);display:none;place-items:center;z-index:60;padding:16px}
.modal.on{display:grid;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.dlg{background:linear-gradient(180deg,#fffefb,#f8efdd);border-radius:26px;max-width:430px;width:100%;padding:28px 24px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35);border:1px solid #ead9b8;animation:dlgIn .5s cubic-bezier(.2,1.2,.3,1)}
@keyframes dlgIn{from{transform:scale(.8) translateY(20px);opacity:0}}
.dlg h2{margin-top:0}
.stars{font-size:2rem;color:var(--gold);letter-spacing:6px;margin:0}
.stars .off{color:var(--line)}
.rows{text-align:start;margin:14px 0;border-top:1px solid var(--line)}
.rows div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)}
.rows .tot{font-weight:800;color:var(--gold-d);font-size:1.3rem}
.rows .tot b{display:inline-block;animation:pop2 .8s .2s both}
@keyframes pop2{from{transform:scale(.6);opacity:0}60%{transform:scale(1.2)}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--cocoa);color:#fbeed0;padding:12px 20px;border-radius:999px;z-index:80;display:none;box-shadow:var(--shadow-l);max-width:92vw;text-align:center}
.input{padding:12px 16px;border-radius:14px;border:1px solid var(--line);font:inherit;width:100%;margin:8px 0;background:var(--paper)}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--paper);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line)}
th,td{padding:12px 14px;text-align:start;border-bottom:1px solid var(--line)}
th{background:var(--sand);color:var(--cocoa)}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(1) td:first-child{color:var(--gold-d);font-weight:800}
code.k{background:var(--bg2);padding:3px 10px;border-radius:8px;font-weight:700;letter-spacing:1.5px;direction:ltr;display:inline-block;border:1px dashed var(--tan)}
.empty{color:var(--muted);text-align:center;padding:28px}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.9rem;text-align:center;position:relative;z-index:1}
footer b{color:var(--cocoa)}
@media(max-width:560px){.brand b{font-size:.92rem}.brand small{display:none}.mono{width:36px;height:36px}.table{padding:12px;border-radius:22px}.board{gap:8px}.ring{width:54px;height:54px}.ring::after{inset:5px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .rv{opacity:1;transform:none}#fx,#confetti{display:none}.stack{transition:none}
}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="banner" id="banner"></div>
<header class="top"><div class="wrap bar">
  <button class="brand" data-go="home" aria-label="Malak Ashraf Beauty Center">
    <span class="mono">MA</span><span><b>Malak Ashraf</b><small>Beauty Center</small></span>
  </button>
  <nav id="nav" aria-label="main">
    <button data-go="home" data-i="nav_home"></button>
    <button data-go="play" data-i="nav_play"></button>
    <button data-go="rewards" data-i="nav_rewards"></button>
    <button data-go="board" data-i="nav_board"></button>
  </nav>
  <span class="credits" id="creditsChip"></span>
  <button class="chip" id="accBtn"></button>
  <button class="chip" id="langBtn" aria-label="Language">EN</button>
</div></header>

<main class="wrap">
<!-- HOME -->
<section class="view on" id="v-home">
  <div class="hero">
    <div>
      <span class="eyebrow">✦ <span data-i="tag_club"></span></span>
      <h1 id="heroTitle"></h1>
      <p class="lead" data-i="h_desc"></p>
      <p><button class="btn gold" data-go="play" data-i="play_now"></button></p>
      <div class="strip">
        <div><b>6</b><span data-i="st_pairs"></span></div>
        <div><b>60</b><span data-i="st_sec"></span></div>
        <div><b>4</b><span data-i="st_rewards"></span></div>
      </div>
    </div>
    <div class="scene" id="scene" aria-hidden="true">
      <div class="glow"></div>
      <div class="stack" id="stack">
        <div class="c3d c1" id="s1"></div><div class="c3d c2" id="s2"></div>
        <div class="c3d c3 back"><span>MA</span></div>
        <div class="c3d c4" id="s4"></div><div class="c3d c5" id="s5"></div>
        <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
      </div>
    </div>
  </div>
  <div class="section"><div class="sechead rv"><h2 data-i="how_title"></h2></div>
    <div class="grid3">
      <div class="panel step rv" data-tilt><span class="ico" id="hi1"></span><div><h3 data-i="how1_t"></h3><span data-i="how1_d"></span></div></div>
      <div class="panel step rv" data-tilt><span class="ico" id="hi2"></span><div><h3 data-i="how2_t"></h3><span data-i="how2_d"></span></div></div>
      <div class="panel step rv" data-tilt><span class="ico" id="hi3"></span><div><h3 data-i="how3_t"></h3><span data-i="how3_d"></span></div></div>
    </div></div>
  <div class="section"><div class="sechead rv"><h2 data-i="lv_title"></h2></div><div class="grid3" id="levelsHome"></div></div>
  <div class="section"><div class="sechead rv"><h2 data-i="rw_prev"></h2></div><div class="grid4" id="rewardsHome"></div>
    <p class="rv" style="margin-top:20px"><button class="btn ghost" data-go="rewards" data-i="rw_all"></button></p></div>
</section>

<!-- PLAY -->
<section class="view" id="v-play">
  <div id="levelSelect">
    <div class="sechead"><h2 data-i="choose_level"></h2></div><div class="grid3" id="levelsPlay"></div>
    <p class="lead" style="margin-top:22px" data-i="anon_note"></p>
  </div>
  <div id="gameArea" style="display:none">
    <div class="hud">
      <div class="stat" id="stTime"><div class="ring" id="ring"><b id="vTime">60</b></div><span data-i="time"></span></div>
      <div class="stat"><b id="vScore">0</b><span data-i="score_prov"></span></div>
      <div class="stat"><b id="vPairs">0/6</b><span data-i="pairs"></span></div>
      <div class="stat"><b id="vAtt">0</b><span data-i="attempts"></span></div>
    </div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="prog"><div id="progBar"></div></div>
    <div class="table"><div class="board" id="board" role="group"></div></div>
    <p id="live" style="position:absolute;left:-9999px" aria-live="polite"></p>
    <div class="actions">
      <button class="btn ghost" id="hintBtn"></button>
      <button class="btn ghost" id="restartBtn"></button>
      <button class="btn ghost" id="quitBtn"></button>
    </div>
  </div>
</section>

<!-- REWARDS -->
<section class="view" id="v-rewards">
  <div class="sechead"><h2 data-i="rw_title"></h2></div>
  <p class="sub" data-i="rw_note"></p>
  <div class="grid4" id="rewardsList"></div>
  <div class="section"><div class="sechead"><h2 data-i="my_codes"></h2></div><div id="redList"></div></div>
</section>

<!-- LEADERBOARD -->
<section class="view" id="v-board">
  <div class="sechead"><h2 data-i="lb_title"></h2></div>
  <p class="sub" data-i="lb_note"></p>
  <div id="lbBox"></div>
</section>
</main>

<footer><div class="wrap"><b>Malak Ashraf Beauty Center</b><br><span data-i="foot"></span></div></footer>

function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',3200)}

function levelCard(l){
  const ok=l.enabled;
  const d=document.createElement('div');d.className='panel lvl rv'+(ok?'':' locked');d.dataset.tilt='';
  d.innerHTML=`<span class="big">0${l.id}</span><h3>${t(l.k)}</h3><p><span class="tag">${l.pairs} ${t('pairs_l')}</span> &nbsp;⏱ ${l.sec} ${t('sec')}</p>`;
  const b=document.createElement('button');b.className='btn'+(ok?' gold':' ghost');
  b.textContent=ok?t('start'):'🔒 '+t('soon');b.disabled=!ok;
  if(ok)b.onclick=()=>{go('play');startGame(l)};
  d.appendChild(b);return d;

function renderLevels(){
  for(const id of ['#levelsHome','#levelsPlay']){
    const box=$(id);box.innerHTML='';LEVELS.forEach(l=>box.appendChild(levelCard(l)));

function rewardCard(r,withBtn){

  if(withBtn){const b=document.createElement('button');b.className='btn';b.textContent=t('redeem');
    b.disabled=!S.user||S.credits<r.cost;b.onclick=()=>redeem(r);d.appendChild(b);}

function renderRewards(){
  const h=$('#rewardsHome');h.innerHTML='';REWARDS.forEach(r=>h.appendChild(rewardCard(r,false)));

function renderReds(){
  const b=$('#redList');
  if(!S.reds.length){b.innerHTML=`<p class="empty">${t('no_codes')}</p>`;return}
  b.innerHTML='';
  S.reds.slice().reverse().forEach(x=>{
    const r=REWARDS.find(q=>q.id===x.rid);
    const d=document.createElement('div');d.className='panel';d.style.marginBottom='12px';
    d.innerHTML=`<b>${t(r.n)}</b><br><code class="k">${x.code}</code> <span class="tag">${x.used?t('st_used'):t('st_pending')}</span>`;

      m.onclick=()=>{x.used=true;save();renderReds()};d.appendChild(m)}

function renderBoard(){
  const rows=S.scores.map(s=>({n:s.n,s:s.s,sample:false}));
  SAMPLE_BOARD.forEach(([n,s])=>rows.push({n,s,sample:true}));
  rows.sort((a,b)=>b.s-a.s||(a.sample-b.sample));
  let h=`<table><thead><tr><th>${t('rank')}</th><th>${t('name')}</th><th>${t('score')}</th></tr></thead><tbody>`;
  rows.slice(0,10).forEach((r,i)=>{h+=`<tr><td>${i+1}</td><td>${esc(r.n)} ${r.sample?`<span class="tag demo">${t('sample')}</span>`:''}</td><td><b>${r.s}</b></td></tr>`});
  h+='</tbody></table>';
  if(!S.scores.length)h+=`<p class="empty">${t('lb_empty')}</p>`;
  $('#lbBox').innerHTML=h;
}

/* ───────── Router, reveal, tilt, fx ───────── */
let io=null;
function observeReveal(){
  const els=$$('.rv:not(.in)');
  if(RM||!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
  els.forEach((e,i)=>{e.style.transitionDelay=((i%4)*90)+'ms';io.observe(e)});
}
function go(v){
  $$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  $$('#nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.go===v?'page':'false'));
  if(v==='play'&&!(G&&G.active)){$('#levelSelect').style.display='';$('#gameArea').style.display='none'}
  if(v==='rewards'){renderRewards();renderReds()}
  if(v==='board')renderBoard();
  window.scrollTo(0,0);observeReveal();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){
  if(G&&G.active&&b.dataset.go!=='play'){stopTimer()}
  go(b.dataset.go)}});

let tiltEl=null;
function resetTilt(){if(tiltEl){tiltEl.style.transform='';tiltEl=null}}
document.addEventListener('pointermove',e=>{
  if(RM||e.pointerType==='touch')return;
  const el=e.target.closest&&e.target.closest('[data-tilt]');
  if(el!==tiltEl)resetTilt();
  if(!el||(el.classList.contains('rv')&&!el.classList.contains('in')))return;
  tiltEl=el;const r=el.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
  el.style.transitionDelay='0ms';
  el.style.transform=`perspective(900px) rotateX(${(-y*9).toFixed(2)}deg) rotateY(${(x*9).toFixed(2)}deg) translateY(-5px)`;
});
document.addEventListener('pointerleave',resetTilt,true);
(function(){
  const sc=$('#scene'),st=$('#stack');if(!sc||RM)return;
  sc.addEventListener('pointermove',e=>{const r=sc.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    st.style.setProperty('--ry',(x*34).toFixed(1)+'deg');st.style.setProperty('--rx',(8-y*24).toFixed(1)+'deg')});
  sc.addEventListener('pointerleave',()=>{st.style.setProperty('--ry','-14deg');st.style.setProperty('--rx','8deg')});
})();
(function(){
  if(RM)return;const fx=$('#fx');
  for(let i=0;i<16;i++){const s=document.createElement('i');s.textContent=i%3?'✦':'✧';
    s.style.left=(Math.random()*100)+'%';s.style.bottom='-30px';s.style.fontSize=(10+Math.random()*16)+'px';
    s.style.animationDuration=(12+Math.random()*16)+'s';s.style.animationDelay=(-Math.random()*20)+'s';fx.appendChild(s)}
})();
function confetti(){
  if(RM)return;const cv=$('#confetti'),ctx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#b58b45','#e6cf96','#c48b7a','#efd9c4','#ffffff','#8f6a2c'];
  const ps=Array.from({length:110},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*15-4,
    w:6+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let f=0;(function loop(){ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
    if(++f<170)requestAnimationFrame(loop);else ctx.clearRect(0,0,cv.width,cv.height)})();
}

/* ───────── Game ───────── */
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(l){
  stopTimer();
  const chosen=shuffle(SYMS).slice(0,l.pairs);
  G={lvl:l,deck:shuffle([...chosen,...chosen]),matched:[],open:[],lock:false,attempts:0,pairs:0,hints:0,start:null,left:l.sec*1000,active:true,over:false,hintIdx:[]};
  G.matched=G.deck.map(()=>false);
  $('#levelSelect').style.display='none';$('#gameArea').style.display='';
  $('#board').className='board'+(l.cols===5?' c5':'');
  renderTiles();updateHud();$('#hintBtn').disabled=false;
}
function renderTiles(){
  const b=$('#board');b.innerHTML='';
  G.deck.forEach((sym,i)=>{
    const el=document.createElement('button');el.className='tile';
    el.innerHTML=`<div class="in"><div class="face front" aria-hidden="true"><b>MA</b></div><div class="face back" aria-hidden="true">${ART[sym]}</div></div>`;
    el.onclick=()=>flip(i);b.appendChild(el);syncTile(i);
  });
}
function syncTile(i){
  const el=$('#board').children[i];if(!el)return;
  const shown=G.matched[i]||G.open.includes(i);
  el.classList.toggle('flip',shown);el.classList.toggle('matched',G.matched[i]);
  el.classList.toggle('hint',G.hintIdx.includes(i)&&!G.matched[i]);
  el.disabled=G.matched[i]||G.over;
  const st=G.matched[i]?t('matched'):shown?t('s_'+G.deck[i]):t('hidden');
  el.setAttribute('aria-label',`${t('card')} ${i+1}, ${st}`);
}
let tm=null;
function stopTimer(){clearInterval(tm);tm=null}
function tick(){
  const left=Math.max(0,G.lvl.sec*1000-(performance.now()-G.start));
  G.left=left;updateHud();if(left<=0)finish(false);
}
function flip(i){
  if(!G||G.over||G.lock||G.matched[i]||G.open.includes(i))return;
  if(G.start===null){G.start=performance.now();tm=setInterval(tick,100)}
  G.hintIdx=[];G.open.push(i);syncTile(i);
  $('#live').textContent=t('s_'+G.deck[i]);
  if(G.open.length===2){
    G.attempts++;const [a,b]=G.open;
    if(G.deck[a]===G.deck[b]){
      G.matched[a]=G.matched[b]=true;G.pairs++;G.open=[];syncTile(a);syncTile(b);
      if(G.pairs===G.lvl.pairs){finish(true);return}
    }else{
      G.lock=true;
      setTimeout(()=>{const bd=$('#board');[a,b].forEach(k=>{const el=bd.children[k];if(el){el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),420)}})},520);
      setTimeout(()=>{const o=G.open.slice();G.open=[];G.lock=false;o.forEach(syncTile)},900);
    }
  }
  updateHud();
}
function calc(win){
  const pairPts=G.pairs*RULES.perPair,remaining=win?G.left:0;
  const tb=win&&remaining>=RULES.timeBonusMs?RULES.timeBonus:0;
  const ab=win&&G.attempts<=RULES.maxAttempts?RULES.attemptsBonus:0;
  const nb=win&&G.hints===0?RULES.noHintBonus:0;
  return {pairPts,tb,ab,nb,total:pairPts+tb+ab+nb};
}
function updateHud(){
  if(!G)return;
  const s=calc(G.pairs===G.lvl.pairs);
  $('#vTime').textContent=Math.ceil(G.left/1000);
  $('#ring').style.setProperty('--p',Math.max(0,G.left/(G.lvl.sec*1000)*100).toFixed(1));
  $('#stTime').classList.toggle('low',G.left<=10000&&G.start!==null);
  $('#vScore').textContent=s.total;$('#vPairs').textContent=G.pairs+'/'+G.lvl.pairs;$('#vAtt').textContent=G.attempts;
  const pct=Math.round(G.pairs/G.lvl.pairs*100);$('#progBar').style.width=pct+'%';$('#prog').setAttribute('aria-valuenow',pct);
}
function finish(win){
  if(G.over)return;
  G.over=true;G.active=false;stopTimer();
  G.left=win?Math.max(0,G.lvl.sec*1000-(performance.now()-G.start)):0;
  G.deck.forEach((_,i)=>syncTile(i));updateHud();
  const r=calc(win);let msg='';
  if(win){
    if(!S.user)msg=t('login_save');
    else if(S.wins>=CREDIT_CAP_WINS)msg=t('earned_cap');
    else{const credits=5+(r.total>=800?5:0);S.credits+=credits;S.wins++;S.xp+=r.total;msg=`${t('earned')}: +${credits}`}
    if(S.user){S.scores.push({n:S.user,s:r.total,d:Date.now()});S.scores.sort((a,b)=>b.s-a.s);S.scores=S.scores.slice(0,20)}
    save();renderChrome();
  }else msg=t('earned_none');
  const stars=win?(r.total>=850?3:r.total>=700?2:1):0;
  $('#rStars').innerHTML=win?[1,2,3].map(n=>`<span class="${n<=stars?'':'off'}">★</span>`).join(''):'⏳';
  $('#rTitle').textContent=win?t('win'):t('lose');
  $('#rRows').innerHTML=`<div><span>${t('r_pairs')}</span><b>${r.pairPts}</b></div>
   <div><span>${t('r_time')}</span><b>${r.tb}</b></div><div><span>${t('r_att')}</span><b>${r.ab}</b></div>
   <div><span>${t('r_nohint')}</span><b>${r.nb}</b></div><div class="tot"><span>${t('r_total')}</span><b>${r.total}</b></div>`;
  $('#rCredits').textContent=msg;
  setTimeout(()=>{openModal('#mResult');if(win)confetti()},win?600:200);
}
$('#rReplay').onclick=()=>{closeModal('#mResult');startGame(G.lvl)};
$('#rClose').onclick=()=>{closeModal('#mResult');G=null;go('play')};
$('#hintBtn').onclick=()=>{
  if(!G||G.over||G.start===null||G.open.length)return;
  if(G.hints>=1){toast(t('hint_used'));return}
  for(let i=0;i<G.deck.length;i++){if(!G.matched[i]){const j=G.deck.indexOf(G.deck[i],i+1);G.hintIdx=[i,j];break}}
  G.hints++;G.hintIdx.forEach(syncTile);$('#hintBtn').disabled=true;
};
function confirmDlg(title,text,yes){
  $('#cTitle').textContent=title;$('#cText').textContent=text;openModal('#mConfirm');
  $('#cYes').onclick=()=>{closeModal('#mConfirm');yes()};$('#cNo').onclick=()=>closeModal('#mConfirm');
}
$('#restartBtn').onclick=()=>{
  if(!G)return;
  if(G.start===null||G.over){startGame(G.lvl);return}
  confirmDlg(t('confirm_restart_t'),t('confirm_restart_d'),()=>startGame(G.lvl));
};
$('#quitBtn').onclick=()=>{
  const out=()=>{stopTimer();if(G)G.active=false;G=null;$('#levelSelect').style.display='';$('#gameArea').style.display='none'};
  if(G&&G.start!==null&&!G.over)confirmDlg(t('confirm_quit_t'),t('confirm_quit_d'),out);else out();
};

/* ───────── Rewards, account, language ───────── */
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<8;i++)s+=A[rnd(A.length)];return 'MA-'+s.slice(0,4)+'-'+s.slice(4)}
function redeem(r){
  if(!S.user){toast(t('need_login'));return}
  if(S.credits<r.cost){toast(t('insuff'));return}
  const code=newCode();S.credits-=r.cost;S.reds.push({rid:r.id,code,used:false,d:Date.now()});save();
  renderChrome();renderRewards();renderReds();observeReveal();toast(t('redeemed_ok')+' '+code);
}
$('#langBtn').onclick=()=>{S.lang=S.lang==='ar'?'en':'ar';save();applyLang()};
$('#accBtn').onclick=()=>{$('#nameIn').value=S.user||'';openModal('#mAcc')};
$('#accClose').onclick=()=>closeModal('#mAcc');
$('#accSave').onclick=()=>{const n=$('#nameIn').value.trim().slice(0,20);if(!n)return;S.user=n;save();closeModal('#mAcc');applyLang()};
$('#accOut').onclick=()=>{S.user=null;S.credits=0;S.xp=0;S.scores=[];S.reds=[];S.wins=0;save();closeModal('#mAcc');applyLang()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){['#mResult','#mConfirm','#mAcc'].forEach(closeModal)}});

['lipstick','perfume',null,'mirror','compact'].forEach((k,i)=>{const el=$('#s'+(i+1));if(el&&k)el.innerHTML=ART[k]});
$('#hi1').innerHTML=ICON.flip;$('#hi2').innerHTML=ICON.match;$('#hi3').innerHTML=ICON.gift;

applyLang();go('home');
window.__bm={get G(){return G},get S(){return S}};
})();
</script>
